<section class="section section-sable" id="approche">
  <div class="container">
    <p class="eyebrow">{{ methode.eyebrow }}</p>
    <h2 class="section-title mb-5">{{ methode.titre }}</h2>

    <div class="row g-4">
      {% for e in methode.etapes %}
      <div class="col-sm-6 col-lg-3">
        <div class="etape">
          <span class="etape-num">{{ '%02d' % loop.index }}</span>
          <h3 class="etape-titre">{{ e.titre }}</h3>
          <p class="etape-texte">{{ e.texte }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
