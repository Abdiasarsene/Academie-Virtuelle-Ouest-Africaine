<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.nom }}{% endblock %}</title>
  <meta name="description" content="{{ footer.texte }}">
  <meta name="theme-color" content="#172b43">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-academie.jpeg') }}">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Styles propres à l'Académie (chargés après Bootstrap pour le surcharger) -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#contenu">Aller au contenu</a>

  {% include "partials/_bandeau.html" %}
  {% include "partials/_navbar.html" %}

  <main id="contenu">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
